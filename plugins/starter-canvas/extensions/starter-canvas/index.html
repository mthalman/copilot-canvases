<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Starter canvas</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: var(--background-color-default, #ffffff);
        color: var(--text-color-default, #1f2328);
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
        font-size: var(--text-body-medium, 14px);
        line-height: var(--leading-body-medium, 20px);
      }
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-size: var(--text-title-large, 26px);
        font-weight: var(--font-weight-semibold, 600);
        line-height: var(--leading-title-large, 32px);
      }
      p {
        color: var(--text-color-muted, #59636e);
      }
      code {
        font-family: var(--font-mono, Consolas, monospace);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your canvas is ready</h1>
      <p>This page is served by the starter-canvas plugin on a loopback-only HTTP server.</p>
      <p>Ask Copilot to invoke the <code>echo</code> action with a message to check the action connection.</p>
      <p>Replace this page and the example action to build your own canvas.</p>
    </main>
  </body>
</html>
